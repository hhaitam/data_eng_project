[build-system]
requires = ["setuptools>=59.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dvf-elt"
version = "0.1.0"
description = "ELT pipeline for DVF data"
dependencies = [
    "requests",
    "psycopg[binary]",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: needs a real running database (docker compose up)",
]